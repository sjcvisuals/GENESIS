# Windows packaging + WinSparkle auto-update wiring.
# Produces GenesisSetup-*.exe when Inno Setup is available on the runner.
# Does not publish a signed update feed — see docs/windows-auto-update.md.

name: Windows package

on:
  workflow_dispatch:
  push:
    paths:
      - "cmake/WinSparkle.cmake"
      - "platform/AutoUpdate.*"
      - "platform/Version.hpp.in"
      - "platform/genesis_version.rc.in"
      - "installer/**"
      - "scripts/package-installer.ps1"
      - "scripts/stage-installer.ps1"
      - "scripts/publish-appcast.ps1"
      - "docs/windows-auto-update.md"
      - ".github/workflows/windows-package.yml"
  pull_request:
    paths:
      - "cmake/WinSparkle.cmake"
      - "platform/AutoUpdate.*"
      - "installer/**"
      - "scripts/package-installer.ps1"
      - "scripts/stage-installer.ps1"
      - "docs/windows-auto-update.md"

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.1.1
        with:
          version: 1.3.280.0
          cache: true

      - name: Configure (Ninja / MSVC)
        shell: pwsh
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DGENESIS_ENABLE_WINSPARKLE=ON `
            -DGENESIS_UPDATE_APPCAST_URL=https://updates.example.com/genesis/appcast.xml

      - name: Build editor + packaging targets
        shell: pwsh
        run: |
          cmake --build build -j --target genesis_gltf_viewer genesis_player ExtGenesis

      - name: Verify WinSparkle.dll next to editor
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter WinSparkle.dll -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $dll) { throw "WinSparkle.dll missing — auto-update packaging failed" }
          Write-Host "Found $($dll.FullName)"

      - name: Stage installer tree
        shell: pwsh
        run: |
          .\scripts\stage-installer.ps1 -RepoRoot $PWD -BuildDir (Join-Path $PWD "build") -Configuration Release
          Test-Path (Join-Path $PWD "build\package\staging\Editor\genesis_gltf_viewer.exe")

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Compile GenesisSetup.exe
        shell: pwsh
        run: |
          .\scripts\package-installer.ps1 -SkipBuild
          Get-ChildItem build\package\GenesisSetup-*.exe | ForEach-Object { Write-Host $_.FullName; $_.Length }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenesisSetup
          path: build/package/GenesisSetup-*.exe
          if-no-files-found: warn
